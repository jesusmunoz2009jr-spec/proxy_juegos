<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Google Classroom - Panel Principal</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/ic_product_classroom_32.png">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .proxy-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .btn-launch {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-launch:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="proxy-card">
        <h1>Portal de Tareas</h1>
        <p>Introduce la URL del sitio web o juego que deseas abrir de forma camuflada:</p>
        
        <input type="text" id="targetUrl" placeholder="https://ejemplo.com/juego">
        <br>
        <button class="btn-launch" onclick="launchStealthProxy()">Abrir en Modo Oculto (about:blank)</button>
    </div>

    <script>
        function launchStealthProxy() {
            const rawUrl = document.getElementById('targetUrl').value.trim();
            if(!rawUrl) {
                alert("Por favor, introduce una URL válida.");
                return;
            }

            let formattedUrl = rawUrl;
            if (!formattedUrl.startsWith('http://') && !formattedUrl.startsWith('https://')) {
                formattedUrl = 'https://' + formattedUrl;
            }

            // Abre una pestaña en blanco (about:blank)
            let stealthWindow = window.open('about:blank', '_blank');
            
            if(!stealthWindow || stealthWindow.closed || typeof stealthWindow.closed == 'undefined') {
                alert("Las ventanas emergentes (pop-ups) están bloqueadas. Habilítalas en tu navegador.");
                return;
            }

            // Inyecta la estructura camuflada y el juego dentro de la pestaña oculta
            let doc = stealthWindow.document;
            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Google Classroom</title>
                    <link rel="icon" href="https://ssl.gstatic.com/classroom/ic_product_classroom_32.png">
                    <style>
                        body, html {
                            margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
                        }
                        iframe {
                            width: 100%; height: 100%; border: none;
                        }
                    </style>
                </head>
                <body>
                    <iframe src="${formattedUrl}"></iframe>
                </body>
                </html>
            `);
            doc.close();
        }
    </script>

</body>
</html>
